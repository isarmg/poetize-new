name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: poetize-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - name: Build web
        working-directory: poetize-web
        run: |
          npm ci
          npm run build
      - name: Check and build server
        working-directory: poetize-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
      - name: Install Chromium
        working-directory: poetize-web
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: bash poetize-rs/scripts/smoke.sh
