name: Release Linux x86_64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            poetize-ui/package-lock.json
            poetize-im-ui/package-lock.json

      - name: Build blog and admin UI
        working-directory: poetize-ui
        run: |
          npm ci --include=dev
          npm run build

      - name: Build IM UI
        working-directory: poetize-im-ui
        run: |
          npm ci --include=dev
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build backend
        working-directory: poetize-server
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Package Linux x86_64 distribution
        run: ./scripts/package-linux-x86_64.sh "${GITHUB_REF_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poetize-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Poetize ${GITHUB_REF_NAME}"
