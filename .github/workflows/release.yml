name: Release Linux x86_64

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: poetize-web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Build web
        working-directory: poetize-web
        run: |
          npm ci
          npm run build

      - name: Verify and build server
        working-directory: poetize-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          cargo build --locked --release

      - name: Install Chromium
        working-directory: poetize-web
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: bash poetize-rs/scripts/smoke.sh

      - name: Package Linux x86_64 distribution
        run: bash scripts/package-linux-x86_64.sh "${GITHUB_REF_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poetize-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --title "Poetize ${GITHUB_REF_NAME}"
