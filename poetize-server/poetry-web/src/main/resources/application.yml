server:
  port: 8081
  forward-headers-strategy: native
  tomcat:
    threads.max: 50
    max-connections: 100
    max-http-form-post-size: 21MB
    connection-timeout: 60000

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  mail:
    host: smtp.qq.com
    username:
    password:
    default-encoding: utf-8
    protocol: smtp
    port: 465
    properties:
      mail:
        smtp:
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          ssl:
            enable: true

  datasource:
    username:
    password:
    url: jdbc:mysql://localhost:3306/poetize?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver

poetry:
  database:
    init-script: ${POETRY_DATABASE_INIT_SCRIPT:file:/home/poetry.sql}
  admin:
    initial-password: ${POETRY_ADMIN_INITIAL_PASSWORD:}

user:
  code:
    format:
  subscribe:
    format:

local:
  uploadUrl:
  downloadUrl:
