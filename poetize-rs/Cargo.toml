[package]
name = "poetize-rs"
version = "3.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sarmg-admin-auth = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "b146afefb1e864de78d5f6ac43cab7d1a4e02fc7", version = "=0.9.0" }
sarmg-admin-axum = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "b146afefb1e864de78d5f6ac43cab7d1a4e02fc7", version = "=0.9.0" }
sarmg-admin-core = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "b146afefb1e864de78d5f6ac43cab7d1a4e02fc7", version = "=0.9.0" }
sarmg-admin-sqlite = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "b146afefb1e864de78d5f6ac43cab7d1a4e02fc7", version = "=0.9.0" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "deny"
